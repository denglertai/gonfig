name: goreleaser

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - '**'           # Push events to every tag including hierarchical tags like v1.0/beta

# Jobs only get the permissions they need, see the permissions of each job
permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      # Create the release and upload its assets
      contents: write
      # Push the container image to ghcr.io
      packages: write
      # Sign the container image and create attestations keyless with cosign and actions/attest
      id-token: write
      # Store the build provenance in the attestations of the repository
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Linux ARM64 cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Install Zig for CGO cross-compilation
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xf zig-x86_64-linux-0.15.2.tar.xz
          sudo mv zig-x86_64-linux-0.15.2 /usr/local/zig
          rm zig-x86_64-linux-0.15.2.tar.xz
          echo "/usr/local/zig" >> $GITHUB_PATH
      - name: Verify Zig installation
        run: zig version
      - name: Set Zig version env var
        run: echo "ZIG_VERSION=$(zig version)" >> $GITHUB_ENV
      - name: Check if release already exists
        id: release-check
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release for tag ${GITHUB_REF_NAME} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ No existing release found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete existing release if present
        if: steps.release-check.outputs.exists == 'true'
        run: |
          echo "Deleting existing release ${GITHUB_REF_NAME}..."
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup syft
        uses: anchore/sbom-action/download-syft@latest # installs syft
      # The image only copies binaries, so building it for arm64 needs no QEMU
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Run GoReleaser with Zig
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The SBOM of each platform image is attached as a signed attestation, keyless like the image signatures.
      # It is attached to the platform image for scanners and to the index, which cosign verify-attestation resolves tags to.
      - name: Attest the SBOMs of the container image
        id: image
        env:
          IMAGE: ghcr.io/denglertai/gonfig
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}')
          index_digest=$(jq -r '.digest' <<<"$index")
          echo "index-digest=$index_digest" >> "$GITHUB_OUTPUT"
          jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)-\(.platform.architecture) \(.digest)"' <<<"$index" |
            while read -r platform digest; do
              sbom="${RUNNER_TEMP}/sbom-${platform}.spdx.json"
              syft scan "registry:$IMAGE@$digest" --quiet --output "spdx-json=$sbom"
              for subject in "$digest" "$index_digest"; do
                cosign attest --yes --type spdxjson --predicate "$sbom" "$IMAGE@$subject"
              done
            done
      # SLSA build provenance, which gh attestation verify checks. The provenance of the image is stored in the registry as well.
      - name: Attest the build provenance of the container image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/denglertai/gonfig
          subject-digest: ${{ steps.image.outputs.index-digest }}
          push-to-registry: true
          # Storage records are only available for repositories owned by organizations
          create-storage-record: false
      - name: Attest the build provenance of the release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/gonfig_*.tar.gz
            dist/gonfig_*.zip

  build-macos:
    needs: goreleaser
    permissions:
      contents: read
      # Create the build provenance of the archive keyless
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goarch: amd64
            archive_arch: x86_64
          - runner: macos-latest
            goarch: arm64
            archive_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build Darwin binary with CGO
        run: |
          mkdir -p dist/darwin-${{ matrix.goarch }}
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            export CC="clang -target x86_64-apple-darwin"
            export CXX="clang++ -target x86_64-apple-darwin"
          else
            export CC=clang
            export CXX=clang++
          fi
          # Same version information as the GoReleaser builds, see ldflags in .goreleaser.yaml
          pkg=github.com/denglertai/gonfig/internal/version
          commit_date=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)
          ldflags="-s -w -X $pkg.version=${GITHUB_REF_NAME#v} -X $pkg.commit=${GITHUB_SHA} -X $pkg.date=${commit_date}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "$ldflags" -o dist/darwin-${{ matrix.goarch }}/gonfig .
          cp LICENSE dist/darwin-${{ matrix.goarch }}/LICENSE
          tar -C dist/darwin-${{ matrix.goarch }} -czf dist/gonfig_Darwin_${{ matrix.archive_arch }}.tar.gz gonfig LICENSE
      - name: Attest the build provenance of the Darwin archive
        uses: actions/attest@v4
        with:
          subject-path: dist/gonfig_Darwin_${{ matrix.archive_arch }}.tar.gz
      - name: Upload Darwin archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.goarch }}
          path: dist/gonfig_Darwin_${{ matrix.archive_arch }}.tar.gz

  upload-macos-assets:
    needs: build-macos
    permissions:
      # Upload the Darwin archives to the release
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Darwin archives
        uses: actions/download-artifact@v8
        with:
          path: dist-macos
      - name: Upload Darwin archives to release
        run: |
          set -euo pipefail
          mapfile -t existing < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          shopt -s globstar nullglob
          for file in dist-macos/**/*.tar.gz; do
            name=$(basename "$file")
            if printf '%s\n' "${existing[@]}" | grep -qx "$name"; then
              echo "Skipping existing asset: $name"
            else
              echo "Uploading asset: $name"
              gh release upload "${GITHUB_REF_NAME}" "$file"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}