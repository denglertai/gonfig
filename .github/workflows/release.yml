name: goreleaser

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - '**'           # Push events to every tag including hierarchical tags like v1.0/beta

# Jobs only get the permissions they need, see the permissions of each job
permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      # Create the release and upload its assets
      contents: write
      # Push the container image to ghcr.io
      packages: write
      # Sign the container image and create attestations keyless with cosign and actions/attest
      id-token: write
      # Store the build provenance in the attestations of the repository
      attestations: write
    runs-on: ubuntu-latest
    env:
      # Same version as goreleaser-check in go.yml and the Makefile, so local dry runs match the release
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.20.3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # A poisoned cache could alter the released binaries
          cache: false
          # The toolchain of go.mod, so releases are built with the Go version CI tested
          go-version-file: go.mod
      - name: Check if release already exists
        id: release-check
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release for tag ${GITHUB_REF_NAME} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ No existing release found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete existing release if present
        if: steps.release-check.outputs.exists == 'true'
        run: |
          echo "Deleting existing release ${GITHUB_REF_NAME}..."
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      # The image only copies binaries, so building it for arm64 needs no QEMU
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The SBOM of each platform image is attached as a signed attestation, keyless like the image signatures.
      # It is attached to the platform image for scanners and to the index, which cosign verify-attestation resolves tags to.
      - name: Attest the SBOMs of the container image
        id: image
        env:
          IMAGE: ghcr.io/denglertai/gonfig
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}')
          index_digest=$(jq -r '.digest' <<<"$index")
          echo "index-digest=$index_digest" >> "$GITHUB_OUTPUT"
          jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)-\(.platform.architecture) \(.digest)"' <<<"$index" |
            while read -r platform digest; do
              sbom="${RUNNER_TEMP}/sbom-${platform}.spdx.json"
              syft scan "registry:$IMAGE@$digest" --quiet --output "spdx-json=$sbom"
              for subject in "$digest" "$index_digest"; do
                cosign attest --yes --type spdxjson --predicate "$sbom" "$IMAGE@$subject"
              done
            done
      # SLSA build provenance, which gh attestation verify checks. The provenance of the image is stored in the registry as well.
      - name: Attest the build provenance of the container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/denglertai/gonfig
          subject-digest: ${{ steps.image.outputs.index-digest }}
          push-to-registry: true
          # Storage records are only available for repositories owned by organizations
          create-storage-record: false
      # Covers the archives of every platform, including macOS, and the checksums file listing them
      - name: Attest the build provenance of the release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/gonfig_*.tar.gz
            dist/gonfig_*.zip
            dist/gonfig-plugin-*.tar.gz
            dist/gonfig-plugin-*.zip
            dist/*checksums.txt
