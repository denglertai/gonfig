name: melange

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - '**'           # Push events to every tag including hierarchical tags like v1.0/beta

permissions:
  contents: write
  # Create the build provenance of the apk keyless
  id-token: write
  attestations: write

jobs:
  melange:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        
    - name: Set up melange
      run: go install chainguard.dev/melange@latest

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare melange build
      run: | 
        echo "${{ secrets.MELANGE_RSA_KEY }}" > ${{ runner.temp }}/melange.rsa 
        
        sudo apt-get update -y
        sudo apt-get install -y bubblewrap

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
  
    - name: clone apk repository
      uses: actions/checkout@v7
      with:
        repository: denglertai/apk
        ref: 'gh-pages'
        path: ./apk
        token: '${{ secrets.APK_REPO_TOKEN }}'

    # The commit and its date are printed by gonfig --version, see vars in melange.yaml
    - name: Write melange vars
      run: |
        {
          echo "commit: \"${GITHUB_SHA}\""
          echo "commit-date: \"$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)\""
        } > ${{ runner.temp }}/melange-vars.yaml
        cat ${{ runner.temp }}/melange-vars.yaml

    - name: Run melange
      run: melange build melange.yaml --out-dir ./apk --arch=x86_64 --signing-key ${{ runner.temp }}/melange.rsa --vars-file ${{ runner.temp }}/melange-vars.yaml

    # The apk repository contains the packages of previous releases as well, so only the built one is attested
    - name: Find the built apk
      id: apk
      run: |
        version=$(awk '/^  version:/ {print $2; exit}' melange.yaml)
        epoch=$(awk '/^  epoch:/ {print $2; exit}' melange.yaml)
        path="apk/x86_64/gonfig-${version}-r${epoch}.apk"
        test -f "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Attest the build provenance of the apk
      uses: actions/attest@v4
      with:
        subject-path: ${{ steps.apk.outputs.path }}
    
    - name: Commit changes
      run: |
        cp ./melange.rsa.pub ./apk/melange.rsa.pub

        cd ./apk
        git config --global user.email "${{ github.actor }}"
        git config --global user.name "${{ github.actor }}@users.noreply.github.com"
        git add .
        git commit -m "Update apk for gonfig@${{ github.ref }}"
        git push
      env:
        GITHUB_TOKEN: "${{ secrets.APK_REPO_TOKEN }}"