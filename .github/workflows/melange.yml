name: melange

on:
  push:
    # Pattern matched against refs/tags
    tags:        
      - '**'           # Push events to every tag including hierarchical tags like v1.0/beta

permissions:
  contents: write
  # Create the build provenance of the apk keyless
  id-token: write
  attestations: write

jobs:
  melange:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # A poisoned cache could alter the released binaries
        cache: false
        # Only builds melange, which may need a newer Go than gonfig; the apk is built with the go package of Wolfi
        go-version: stable
        
    - name: Set up melange
      env:
        # melange builds and signs the apk, so it is pinned like the actions and updated by Renovate
        # renovate: datasource=go depName=chainguard.dev/melange
        MELANGE_VERSION: v0.63.2
      run: go install "chainguard.dev/melange@${MELANGE_VERSION}"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    # apk finds the key of a signature by the file name of the signing key plus .pub, so the key is named after this
    # repository instead of melange's default name melange.rsa, which other repositories use as well (#348)
    - name: Prepare melange build
      run: | 
        echo "${{ secrets.MELANGE_RSA_KEY }}" > ${{ runner.temp }}/denglertai.rsa
        
        sudo apt-get update -y
        sudo apt-get install -y bubblewrap

        sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
  
    # The credentials stay persisted for the push in "Commit changes", and this job uploads no artifacts
    - name: clone apk repository # zizmor: ignore[artipacked]
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: denglertai/apk
        ref: 'gh-pages'
        path: ./apk
        token: '${{ secrets.APK_REPO_TOKEN }}'

    # The commit and its date are printed by gonfig --version, see vars in melange.yaml
    - name: Write melange vars
      run: |
        {
          echo "commit: \"${GITHUB_SHA}\""
          echo "commit-date: \"$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)\""
        } > ${{ runner.temp }}/melange-vars.yaml
        cat ${{ runner.temp }}/melange-vars.yaml

    - name: Run melange
      run: melange build melange.yaml --out-dir ./apk --arch=x86_64 --signing-key ${{ runner.temp }}/denglertai.rsa --vars-file ${{ runner.temp }}/melange-vars.yaml

    # The apk repository contains the packages of previous releases as well, so only the built ones are attested:
    # gonfig and the plugins of its subpackages
    - name: Find the built apks
      id: apk
      run: |
        version=$(awk '/^  version:/ {print $2; exit}' melange.yaml)
        epoch=$(awk '/^  epoch:/ {print $2; exit}' melange.yaml)
        {
          echo "paths<<EOF"
          for name in gonfig gonfig-plugin-openbao gonfig-plugin-azure-keyvault; do
            path="apk/x86_64/${name}-${version}-r${epoch}.apk"
            test -f "$path"
            echo "$path"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Attest the build provenance of the apks
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ${{ steps.apk.outputs.paths }}
    
    - name: Commit changes
      run: |
        # The same key under both names: denglertai.rsa.pub for the index and new packages, melange.rsa.pub for
        # packages signed before the key was renamed
        cp ./melange.rsa.pub ./apk/denglertai.rsa.pub
        cp ./melange.rsa.pub ./apk/melange.rsa.pub

        cd ./apk
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        git add .
        git commit -m "Update apk for gonfig@${GITHUB_REF}"
        git push
      env:
        GITHUB_TOKEN: "${{ secrets.APK_REPO_TOKEN }}"