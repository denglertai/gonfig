name: Go

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

# The jobs only read the repository; Codecov is authenticated with its own token
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Releases are built for Linux, macOS and Windows, so platform specific problems like paths are found before
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.2'

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      # PowerShell, the default shell on Windows, splits arguments like -coverprofile=coverage.txt at the dot
      shell: bash
      run: go test ./... -coverprofile=coverage.txt

    - name: Upload coverage reports to Codecov
      # Codecov merges the reports of all systems, so platform specific code is covered as well
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ runner.os }}

  race:
    # Package level state, e.g. the registered filters, and executable plugins talking over pipes are prone to data races
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.2'

    - name: Run tests with the race detector
      run: go test -race ./...

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.2'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile
        version: v2.15.0

  trivy-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Runs the official image by digest instead of trivy-action or setup-trivy, whose tags were
    # replaced with malware in March 2026 (GHSA-69fq-xp46-6x23). Renovate updates tag and digest.
    - name: Run Trivy scan
      uses: docker://ghcr.io/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      with:
        args: fs --exit-code 1 --severity HIGH,CRITICAL .

  # Keeps the workflows free of unpinned actions, template injection and similar problems
  zizmor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
      with:
        # Fail the job on findings instead of uploading them to code scanning
        advanced-security: false
        annotations: true
        # Without a version, the action installs the zizmor of its own hash-pinned lockfile for latest,
        # so zizmor stays pinned by the commit of the action and is updated with it
