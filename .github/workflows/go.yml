name: Go

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

# The jobs only read the repository; Codecov is authenticated with its own token
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Releases are built for Linux, macOS and Windows, so platform specific problems like paths are found before
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      # PowerShell, the default shell on Windows, splits arguments like -coverprofile=coverage.txt at the dot
      shell: bash
      run: go test ./... -coverprofile=coverage.txt

    - name: Test plugin modules
      # Plugins are separate modules, which go test ./... of the root module doesn't include.
      # Each module writes its own coverage report, which Codecov finds and merges.
      shell: bash
      run: |
        for mod in plugins/*/go.mod; do
          dir=$(dirname "$mod")
          echo "::group::$dir"
          (cd "$dir" && go test ./... -coverprofile=coverage.txt)
          echo "::endgroup::"
        done

    - name: Upload coverage reports to Codecov
      # Codecov merges the reports of all systems, so platform specific code is covered as well
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: ${{ runner.os }}

  race:
    # Package level state, e.g. the registered filters, and executable plugins talking over pipes are prone to data races
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run tests with the race detector
      run: go test -race ./...

    - name: Run tests of plugin modules with the race detector
      run: |
        for mod in plugins/*/go.mod; do
          (cd "$(dirname "$mod")" && go test -race ./...)
        done

  lint:
    runs-on: ubuntu-latest
    env:
      # Same version as make lint, updated by Renovate
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      GOLANGCI_LINT_VERSION: v2.15.0

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}

    # Plugins are separate modules; golangci-lint finds the .golangci.yml of the repository root from their directories
    - name: Run golangci-lint for plugin modules
      run: |
        for mod in plugins/*/go.mod; do
          (cd "$(dirname "$mod")" && go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}" run ./...)
        done

  trivy-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Runs the official image by digest instead of trivy-action or setup-trivy, whose tags were
    # replaced with malware in March 2026 (GHSA-69fq-xp46-6x23). Renovate updates tag and digest.
    - name: Run Trivy scan
      uses: docker://ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      with:
        args: fs --exit-code 1 --severity HIGH,CRITICAL .

  # Fails on deprecated properties as well, so they are noticed before a GoReleaser update drops them
  goreleaser-check:
    runs-on: ubuntu-latest
    env:
      # Same version as release.yml and the Makefile, updated by Renovate
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.19.0

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Check the GoReleaser configuration
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: ${{ env.GORELEASER_VERSION }}
        args: check

  # Keeps the workflows free of unpinned actions, template injection and similar problems
  zizmor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      with:
        # Fail the job on findings instead of uploading them to code scanning
        advanced-security: false
        annotations: true
        # Without a version, the action installs the zizmor of its own hash-pinned lockfile for latest,
        # so zizmor stays pinned by the commit of the action and is updated with it
