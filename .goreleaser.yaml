# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser configuration using Zig for CGO cross-compilation
version: 2

project_name: gonfig

builds:
  # Linux AMD64
  - id: linux-amd64
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
    # The version is printed by gonfig --version, see internal/version. The commit date keeps builds reproducible.
    ldflags: &ldflags
      - -s -w
      - -X github.com/denglertai/gonfig/internal/version.version={{ .Version }}
      - -X github.com/denglertai/gonfig/internal/version.commit={{ .FullCommit }}
      - -X github.com/denglertai/gonfig/internal/version.date={{ .CommitDate }}

  # Linux ARM64
  - id: linux-arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags: *ldflags

  # Windows AMD64
  - id: windows-amd64
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-windows-gnu
      - CXX=zig c++ -target x86_64-windows-gnu
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildmode=exe
    ldflags: *ldflags

  # Plugins for secret managers, released with gonfig. They don't need cgo, so they are built for every platform here,
  # including macOS, which gonfig itself is built for in a separate job of release.yml.
  - id: plugin-openbao
    dir: plugins/openbao
    binary: gonfig-plugin-openbao
    env: &pluginEnv
      - CGO_ENABLED=0
    goos: &pluginGoos
      - linux
      - darwin
      - windows
    goarch: &pluginGoarch
      - amd64
      - arm64
    ignore: &pluginIgnore
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

  - id: plugin-azure-keyvault
    dir: plugins/azure-keyvault
    binary: gonfig-plugin-azure-keyvault
    env: *pluginEnv
    goos: *pluginGoos
    goarch: *pluginGoarch
    ignore: *pluginIgnore
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: gonfig
    # Archives include all builds by default, so the plugins get archives of their own below
    ids:
      - linux-amd64
      - linux-arm64
      - windows-amd64
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

  # One archive per plugin, e.g. gonfig-plugin-openbao_Linux_x86_64.tar.gz
  - id: plugin-openbao
    ids:
      - plugin-openbao
    formats: [tar.gz]
    name_template: &pluginArchiveName >-
      {{ .Binary }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides: &pluginFormatOverrides
      - goos: windows
        formats: [zip]
    files: &pluginFiles
      - LICENSE

  - id: plugin-azure-keyvault
    ids:
      - plugin-azure-keyvault
    formats: [tar.gz]
    name_template: *pluginArchiveName
    format_overrides: *pluginFormatOverrides
    files: *pluginFiles

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: denglertai
    name: gonfig
  draft: true
  prerelease: auto
  make_latest: true
  header: |
    ## Release {{ .Tag }}
    
    Multi-architecture binaries built with CGO enabled

    Plugins for secret managers, see PLUGINS.md: `gonfig-plugin-openbao` (OpenBao, HashiCorp Vault) and `gonfig-plugin-azure-keyvault` (Azure Key Vault)

    Container image for linux/amd64 and linux/arm64, including the plugins: `ghcr.io/denglertai/gonfig:{{ .Version }}`
  footer: |
    **Full Changelog**: https://github.com/denglertai/gonfig/compare/{{ .PreviousTag }}...{{ .Tag }}

sboms:
  - artifacts: binary
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Multi-arch image built from the Linux binaries and pushed to ghcr.io on release
dockers_v2:
  - id: gonfig
    # The plugins are part of the image, see release.Dockerfile
    ids:
      - linux-amd64
      - linux-arm64
      - plugin-openbao
      - plugin-azure-keyvault
    dockerfile: release.Dockerfile
    images:
      - ghcr.io/denglertai/gonfig
    # Both forms of the version, e.g. 0.0.29 like the apk and v0.0.29 like the git tag
    tags:
      - "{{ .Version }}"
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - LICENSE
    # Buildx would store the SBOM and provenance as attestation manifests within the image index, which registries
    # like ghcr.io list as images of the platform unknown/unknown. The release workflow attaches signed SBOMs instead.
    sbom: false
    flags:
      - --provenance=false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Fills config files with values from environment variables
      org.opencontainers.image.url: https://github.com/denglertai/gonfig
      org.opencontainers.image.source: https://github.com/denglertai/gonfig
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Fills config files with values from environment variables
      org.opencontainers.image.source: https://github.com/denglertai/gonfig
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: MIT

# Keyless signing with the GitHub Actions OIDC identity of the release workflow.
# An empty artifacts value signs the images of dockers_v2.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes
