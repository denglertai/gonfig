# yaml-language-server: $schema=https://github.com/chainguard-dev/melange/raw/refs/heads/main/pkg/config/schema.json
package:
  name: gonfig
  version: 0.3.0
  epoch: 0
  description: |
    A simple configuration library for Go. It supports JSON, YAML, XML and PROPERTIES files.
  target-architecture:
    - amd64
    - x86_64
    - arm64
  copyright:
    - license: MIT
      license-path: ./LICENSE
      
environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      - ./melange.rsa.pub
    packages:
    - go
    - git
    - syft

# Printed by gonfig --version. The release workflow sets them with --vars-file, as the build runs without VCS information.
vars:
  commit: ""
  commit-date: ""

pipeline:
  - uses: go/build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: "-buildvcs=false"
    with:
      packages: .
      output: gonfig
      ldflags: >-
        -X github.com/denglertai/gonfig/internal/version.version=${{package.version}}
        -X github.com/denglertai/gonfig/internal/version.commit=${{vars.commit}}
        -X github.com/denglertai/gonfig/internal/version.date=${{vars.commit-date}}

# The plugins for secret managers, released with gonfig. Subpackages get the version of gonfig and are built in the
# same run. They install into /usr/libexec/gonfig/plugins, which gonfig searches by default, and need no cgo.
# The dependency on gonfig isn't pinned to a version, since plugins and gonfig only share the versioned plugin protocol.
subpackages:
  - name: gonfig-plugin-openbao
    description: gonfig plugin reading secrets from OpenBao and HashiCorp Vault
    dependencies:
      runtime:
        - gonfig
    pipeline:
      - uses: go/build
        environment:
          CGO_ENABLED: "0"
          GOFLAGS: "-buildvcs=false"
        with:
          modroot: plugins/openbao
          packages: .
          output: gonfig-plugin-openbao
          install-dir: libexec/gonfig/plugins
          # The plugins have gonfig's version, which gonfig plugin list shows
          ldflags: -X main.version=${{package.version}}

  - name: gonfig-plugin-azure-keyvault
    description: gonfig plugin reading secrets from Azure Key Vault
    dependencies:
      runtime:
        - gonfig
    pipeline:
      - uses: go/build
        environment:
          CGO_ENABLED: "0"
          GOFLAGS: "-buildvcs=false"
        with:
          modroot: plugins/azure-keyvault
          packages: .
          output: gonfig-plugin-azure-keyvault
          install-dir: libexec/gonfig/plugins
          ldflags: -X main.version=${{package.version}}
