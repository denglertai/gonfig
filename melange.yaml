# yaml-language-server: $schema=https://github.com/chainguard-dev/melange/raw/refs/heads/main/pkg/config/schema.json
package:
  name: gonfig
  version: 0.0.28
  epoch: 0
  description: |
    A simple configuration library for Go. It supports JSON, YAML, XML and PROPERTIES files.
  target-architecture:
    - amd64
    - x86_64
    - arm64
  copyright:
    - license: MIT
      license-path: ./LICENSE
      
environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      - ./melange.rsa.pub
    packages:
    - go
    - git
    - syft

# Printed by gonfig --version. The release workflow sets them with --vars-file, as the build runs without VCS information.
vars:
  commit: ""
  commit-date: ""

pipeline:
  - uses: go/build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: "-buildvcs=false"
    with:
      packages: .
      output: gonfig
      ldflags: >-
        -X github.com/denglertai/gonfig/internal/version.version=${{package.version}}
        -X github.com/denglertai/gonfig/internal/version.commit=${{vars.commit}}
        -X github.com/denglertai/gonfig/internal/version.date=${{vars.commit-date}}
